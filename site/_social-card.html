<!doctype html><html><head><meta charset="utf-8">
<!-- The Open Graph and Twitter card, img/social-preview.png. Not part of the site: render it at 1200x630, 1x, and save it as an optimized PNG (see README.md). -->
<style>
@font-face{font-family:Fredoka;font-weight:600;font-display:block;src:url(fonts/fredoka-600.woff2)}
@font-face{font-family:Nunito;font-weight:400 800;font-display:block;src:url(fonts/nunito.woff2)}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#2A231D;font-family:Nunito,sans-serif;color:#FBF7F0;position:relative;-webkit-font-smoothing:antialiased}
body::before{content:'';position:absolute;inset:0;background:url('img/grain.png') repeat;background-size:160px;opacity:.05;mix-blend-mode:overlay;z-index:9}
.copy{position:absolute;left:80px;top:100px;width:500px}
.icon{width:112px;height:112px;display:block;filter:drop-shadow(0 12px 18px rgba(120,88,30,.3))}
h1{font-family:Fredoka;font-weight:600;font-size:66px;line-height:1.06;letter-spacing:-.5px;margin:26px 0 18px}
p{font-size:24px;white-space:nowrap;font-weight:600;color:#DCD1C3;margin:0 0 30px;line-height:1.4}
.url{display:inline-block;font-family:Fredoka;font-weight:600;font-size:24px;background:#F4D57E;color:#2A231D;padding:10px 28px;border-radius:999px;box-shadow:0 4px 0 #C9A951}
.laptop{position:absolute;left:596px;top:150px;width:520px}
.screen{position:relative;z-index:1;aspect-ratio:16/10;overflow:hidden;border:8px solid #15110E;border-radius:18px 18px 7px 7px;
background:radial-gradient(70% 90% at 12% 105%,rgba(242,160,166,.85),transparent 60%),radial-gradient(60% 80% at 92% 100%,rgba(244,213,126,.75),transparent 62%),radial-gradient(50% 50% at 80% 10%,rgba(242,160,166,.25),transparent 70%),linear-gradient(180deg,#4A3A2E 0%,#6E5141 55%,#9A6F55 100%);box-shadow:0 30px 50px -24px rgba(0,0,0,.6)}
.panel{position:absolute;top:0;left:50%;transform:translateX(-50%);width:70%;filter:drop-shadow(0 14px 18px rgba(58,30,12,.5))}
.base{position:relative;z-index:1;width:112%;margin-left:-6%;height:12px;background:#3A3029;border-radius:0 0 14px 14px;box-shadow:0 18px 30px -12px rgba(0,0,0,.55)}
.cat{position:absolute;right:-60px;bottom:12px;width:66px;height:78px;background:url('img/pixel-cat.png') 0 0/200% 100% no-repeat;image-rendering:pixelated}
</style></head><body>
<div class="copy"><img class="icon" src="img/icon-256.webp" alt=""><h1>A little cat for your notch.</h1><p>A cozy panel of tabs in your laptop notch.</p><span class="url">tabbinotch.com</span></div>
<div class="laptop"><div class="cat"></div><div class="screen"><img class="panel" src="img/notch-timer.webp" alt=""></div><div class="base"></div></div>
</body></html>
