name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR replaces the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App (build, style, test)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The runner image's default Xcode can lag behind the newest one it
      # ships, and Tabbi builds with a recent Swift. Use the newest stable
      # Xcode on the image (betas and release candidates are skipped).
      - name: Select the newest Xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -n 1 || true)
          if [[ -n "$xcode" ]]; then sudo xcode-select -s "$xcode"; fi
          xcode-select -p

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # Only the resolved dependencies (Sparkle's checkout and binary
      # artifact) are cached. Restoring a whole .build from an older commit
      # can leave stale objects behind, which costs more in flakiness than
      # it saves in time.
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Writing style
        run: scripts/check-style.sh

      - name: Script tests
        run: for test in scripts/tests/*.sh; do "$test"; done

      # The tests are built with the same flags as the app, so the test step
      # below reuses this build instead of compiling everything again.
      - name: Build (warnings are errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test --parallel -Xswiftc -warnings-as-errors

  backend:
    name: Backend (typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  site:
    name: Site build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # The build fails on broken links, missing assets and oversized files.
      - name: Build the site
        run: python3 site/build.py

      # The Pages Function that fills the Suggest form's app facts.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Test the Suggest function
        run: node --test 'site/test/*.test.mjs'

  cask:
    name: Homebrew cask (style, audit)
    runs-on: macos-26
    timeout-minutes: 10
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v5

      # The cask is written for a stand-in DMG and checked from a local tap,
      # the way the ethanwchen/homebrew-tap copy is loaded. The audit stays
      # offline: until a release is published, its DMG and appcast are 404.
      - name: Write the cask into a local tap
        run: |
          dmg="$RUNNER_TEMP/Tabbi-0.1.0.dmg"
          printf 'stand-in' > "$dmg"
          brew tap-new --no-git tabbi-ci/check
          tap=$(brew --repository tabbi-ci/check)
          mkdir -p "$tap/Casks"
          scripts/make-cask.sh "$dmg" "$tap/Casks/tabbi.rb"
          # Homebrew 7 loads casks only from taps the user trusts.
          if brew trust --help > /dev/null 2>&1; then brew trust tabbi-ci/check; fi

      - name: brew style
        run: brew style --cask tabbi-ci/check/tabbi

      - name: brew audit
        run: brew audit --cask --strict tabbi-ci/check/tabbi

  release-dry-run:
    name: Release dry run (ad-hoc)
    # The universal release build takes a while, so pull requests skip it;
    # every push to main proves the release path still works.
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The release build numbers the app by commit count and writes
          # release notes from the history, so it needs all of it.
          fetch-depth: 0

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # The runner image's default Xcode can lag behind the newest one it
      # ships, and Tabbi builds with a recent Swift. Use the newest stable
      # Xcode on the image (betas and release candidates are skipped).
      - name: Select the newest Xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -n 1 || true)
          if [[ -n "$xcode" ]]; then sudo xcode-select -s "$xcode"; fi
          xcode-select -p

      # CI has no Developer ID, so it checks the ad-hoc path of the release
      # build: universal binary, strip, signing, zip, DMG and appcast.
      - name: Release build (universal, ad-hoc signed)
        run: scripts/release.sh --adhoc
