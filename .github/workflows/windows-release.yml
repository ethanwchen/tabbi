name: Windows release

# Builds the Windows installer for a release tag and attaches it to that
# GitHub Release: Tabbi-Setup.exe (the per-user NSIS installer) and
# latest.json (the feed the in-app updater reads from
# releases/latest/download/latest.json). It only runs when started by hand
# (Actions tab > Windows release > Run workflow). When the release does not
# exist yet it creates a DRAFT, which reaches nobody until it is published by
# hand; it never publishes anything itself.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY           the updater's Ed25519 private key, the
#                                       contents of the file
#                                       `tauri signer generate` wrote
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  that key's password
# The matching public key is plugins.updater.pubkey in
# windows/src-tauri/tauri.conf.json. Losing the private key means installed
# copies can no longer be updated, so the owner keeps a backup of it.
#
# The installer itself is not code signed yet, so SmartScreen warns on first
# run. The "Code signing" step below is the hook for Azure Artifact Signing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.1.0); must match the version in tauri.conf.json
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attach the installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: windows
        shell: bash
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match version $version in tauri.conf.json" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - run: npm ci
      - run: npm run icons

      # Code signing (later). Once Azure Artifact Signing is set up, pass a
      # signCommand so Tauri signs the app and the installer while it builds,
      # for example by adding this to the build step below:
      #   --config '{"bundle":{"windows":{"signCommand":"trusted-signing-cli -e https://<region>.codesigning.azure.net -a <account> -c <certificate-profile> -d Tabbi %1"}}}'
      # with AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and AZURE_TENANT_ID as
      # secrets in its env.
      - name: Build (signs the updater bundle)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --ci

      - name: Installer, signature and feed
        run: |
          bundle=src-tauri/target/release/bundle/nsis
          setup=$(ls "$bundle"/*-setup.exe)
          mkdir -p out
          cp "$setup" out/Tabbi-Setup.exe
          signature=$(cat "$setup.sig")
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Tabbi-Setup.exe"
          notes=$(tail -n +3 packaging/release-notes.md)
          node -e '
            const [version, signature, url, notes] = process.argv.slice(1);
            const entry = { signature, url };
            const feed = {
              version,
              notes,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": entry, "windows-x86_64-nsis": entry },
            };
            require("fs").writeFileSync("out/latest.json", JSON.stringify(feed, null, 2) + "\n");
          ' "$VERSION" "$signature" "$url" "$notes"
          ls -l out

      - name: Attach to the release (a draft when it is new)
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Tabbi $VERSION" --notes-file packaging/release-notes.md
          fi
          gh release upload "$TAG" out/Tabbi-Setup.exe out/latest.json --clobber
