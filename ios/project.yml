# The iPhone app's project definition (ios/README.md). Generate the Xcode
# project with `xcodegen generate --spec ios/project.yml`; the generated
# TabbiPhone.xcodeproj is not checked in.
name: TabbiPhone

options:
  bundleIdPrefix: dev.tabbi
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

# TabbiKitCore, the Mac app's pure Swift core, from the package at the repo
# root. Its other targets are Mac only and never build for iOS.
packages:
  Tabbi:
    path: ..

settings:
  base:
    DEVELOPMENT_TEAM: B9VRALHV8S
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The simulator needs no signing identity; device builds sign with the team.
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
    GENERATE_INFOPLIST_FILE: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  TabbiPhone:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: Tabbi
        product: TabbiKitCore
      - target: TabbiLiveActivity
        embed: true
        codeSign: true
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Tabbi
        CFBundleDevelopmentRegion: en
        # The languages TabbiKitCore's strings ship in (L10n.languages).
        CFBundleLocalizations: [en, ar, de, es, fr, fil, ja, ko, pt-BR, ru, zh-Hans, zh-Hant]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tabbi.ios
        PRODUCT_NAME: TabbiPhone
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO

  # The Live Activity and Dynamic Island for a running study session.
  TabbiLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivityExtension
      - path: Shared
    dependencies:
      - package: Tabbi
        product: TabbiKitCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: LiveActivityExtension/Info.plist
      properties:
        CFBundleDisplayName: Tabbi
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar, de, es, fr, fil, ja, ko, pt-BR, ru, zh-Hans, zh-Hant]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tabbi.ios.LiveActivity
        PRODUCT_NAME: TabbiLiveActivity
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  TabbiPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # The golden fixtures the Mac and Windows apps check themselves
      # against, so the iPhone runs the same sessions and points.
      - path: ../shared/fixtures/study-session/study-session.json
        buildPhase: resources
      - path: ../shared/fixtures/study-methods/study-methods.json
        buildPhase: resources
      - path: ../shared/fixtures/closet/closet.json
        buildPhase: resources
      - path: ../shared/fixtures/pets/rendered.json
        buildPhase: resources
    dependencies:
      - target: TabbiPhone
      - package: Tabbi
        product: TabbiKitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tabbi.ios.Tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TabbiPhone.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TabbiPhone
        BUNDLE_LOADER: $(TEST_HOST)

  # Drives the app like a person for the end-to-end check in ios/README.md.
  TabbiPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: TabbiPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tabbi.ios.UITests
        TEST_TARGET_NAME: TabbiPhone

schemes:
  TabbiPhone:
    build:
      targets:
        TabbiPhone: all
        TabbiLiveActivity: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TabbiPhoneTests
  TabbiPhoneUITests:
    build:
      targets:
        TabbiPhone: all
        TabbiPhoneUITests: [test]
    test:
      config: Debug
      targets:
        - TabbiPhoneUITests
