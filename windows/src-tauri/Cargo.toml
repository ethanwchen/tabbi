[package]
name = "tabbi-windows"
version = "0.1.0"
description = "Tabbi for Windows: the island host"
license = "MIT"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "tabbi_windows_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-http = { version = "2.8.3", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy"] }
tauri-plugin-notification = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
  "Foundation",
  "Graphics_Imaging",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
