name = "tabbi-friends"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# One SQLite-backed Durable Object holds all state. SQLite-backed objects are available on the
# Workers Free plan; nothing has to be created in the dashboard before `wrangler deploy`.
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

# The Services ID of web Sign in with Apple (src/webauth.ts), which the Developer ID build uses. It is
# not a secret. Unset, the web callback answers every sign-in with error=not_configured.
[vars]
APPLE_SERVICES_ID = "dev.tabbi.Tabbi.signin"
# The launch day, which starts the 100-day Founding Member window (src/entitlements.ts), as unix seconds or
# an ISO 8601 date (midnight UTC). Set once, at the 1.0 release, and never moved: the window runs to
# 2027-01-19 (exclusive), and accounts made before launch (the beta) count too.
FOUNDING_LAUNCH = "2026-10-11"

# Workers Logs keeps the structured lines from src/log.ts (every 5xx, slow requests and a 1% sample)
# for search and alerts in the dashboard. Invocation logs are off: they would store every request's
# full URL and headers, including friend codes and client IPs. See docs/ops.md "Monitoring".
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# Staging: `npx wrangler deploy --env staging` deploys a separate Worker, tabbi-friends-staging, with
# its own Durable Object, storage and secrets, so a change can be tried before production.
# Bindings are not inherited by environments, so the Durable Object binding is repeated here.
[env.staging]
name = "tabbi-friends-staging"

[[env.staging.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[env.staging.vars]
APPLE_SERVICES_ID = "dev.tabbi.Tabbi.signin"
FOUNDING_LAUNCH = "2026-10-11"
